name: Backend build and PostgreSQL tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test with isolated PostgreSQL
        run: docker compose -p bpm-ci -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Collect reports and logs before removing containers
        if: always()
        run: |
          mkdir -p target/test-results
          docker compose -p bpm-ci -f compose.test.yaml logs --no-color > target/test-results/compose.log 2>&1
          docker compose -p bpm-ci -f compose.test.yaml cp tests:/workspace/target/surefire-reports target/test-results/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: target/test-results
      - name: Remove isolated test stack
        if: always()
        run: docker compose -p bpm-ci -f compose.test.yaml down --volumes
      - name: Package runtime image
        run: docker build --target runtime -t bpm:ci .
