# Standalone test stack; do not merge this file with compose.yaml.
name: bpm-test

services:
  tests:
    build:
      context: .
      target: test
    environment:
      SPRING_PROFILES_ACTIVE: test
      TEST_DATABASE_URL: jdbc:postgresql://postgres:5432/bpm_test?currentSchema=flowable,business,public
      TEST_DATABASE_USERNAME: bpm_test
      TEST_DATABASE_PASSWORD: bpm-test-only
      BPM_STORAGE_ENABLED: "true"
      BPM_STORAGE_ENDPOINT: http://s3mock:9090
      BPM_STORAGE_BUCKET: bpm-test-files
      BPM_STORAGE_ACCESS_KEY: bpm-test-only
      BPM_STORAGE_SECRET_KEY: bpm-test-only-not-a-real-secret
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    volumes:
      - maven-cache:/root/.m2
    networks:
      - bpm-test

  # Isolated protocol stand-in only; no host port, no real AWS credentials/data.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: bpm-test-files
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15s
    networks:
      - bpm-test

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: bpm_test
      POSTGRES_USER: bpm_test
      POSTGRES_PASSWORD: bpm-test-only
    # No published port or dev volume. Data disappears when the DB stops.
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bpm-test

volumes:
  maven-cache:

networks:
  bpm-test:
