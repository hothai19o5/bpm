name: bpm-dev

services:
  backend:
    build:
      context: .
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-bpm}
      DB_USERNAME: ${POSTGRES_USER:-bpm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-root}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-bpm-jwt-secret-change-before-deploy-2026}
      JWT_ISSUER: ${JWT_ISSUER:-https://bpm.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bpm-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-30m}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s
    stop_grace_period: 35s
    networks:
      - bpm

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpm}
      POSTGRES_USER: ${POSTGRES_USER:-bpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bpm

volumes:
  postgres-data:

networks:
  bpm:
