$kind: collection
description: |-
  REST API collection for the BPM (Business Process Management) application.

  Base URL: {{baseUrl}}

  ## Authentication
  Most endpoints require a Bearer JWT access token obtained via POST /api/v1/auth/login.
  The Login request automatically saves the accessToken and refreshToken to collection
  variables via its post-response script.

  ## Modules
  - Auth - login, token refresh, logout, password change, current user identity
  - Admin Users - managed accounts, status, password reset and role membership
  - Organization - departments, positions and requester-manager resolution
  - Forms - catalog/history, create/save/validate/publish/clone and context preview (form.design/form.publish); active published binding selection (process.design)
  - Process Definitions - scoped business catalog, create empty draft v1, management details/configuration/history (P4.1)
variables:
  baseUrl: http://localhost:8080
  accessToken: ""
  refreshToken: ""
  userId: ""
  departmentId: ""
  positionId: ""
  roleId: ""
  permissionId: ""
  formDefinitionId: ""
  formVersionId: ""
  formOperationKey: ""
  processDefinitionId: ""
  processVersionId: ""
  processOperationKey: ""
  processRevision: "0"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
