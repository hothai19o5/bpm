$kind: http-request
order: 8000
method: POST
url: '{{baseUrl}}/api/v1/admin/roles'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "employee",
      "name": "Employee",
      "description": "Employee baseline role",
      "active": true,
      "permissionIds": ["{{permissionId}}"],
      "expectedRevision": 0
    }
