$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/api/v1/auth/refresh'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (pm.response.code === 200 && res.data) {
          pm.collectionVariables.set("accessToken", res.data.accessToken);
          pm.collectionVariables.set("refreshToken", res.data.refreshToken);
          console.log("Tokens refreshed and saved to collection variables.");
      }
