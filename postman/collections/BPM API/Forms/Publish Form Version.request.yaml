$kind: http-request
order: 5000
method: POST
url: '{{baseUrl}}/api/v1/form-definitions/{{formDefinitionId}}/publish'
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: '{{formOperationKey}}'
body:
  type: json
  content: |-
    {
      "versionId": "{{formVersionId}}",
      "expectedRevision": 0
    }
