$kind: collection
name: Process Definitions
description: |-
  P4.1 business catalog and configuration storage; business versionNumber, optimistic revision and engineVersion are separate.
  POST creates a definition plus empty DRAFT v1 atomically and requires process.design. Key matches [a-z][a-z0-9_-]{0,99}; duplicate key returns 409.
  Owner defaults to the authenticated actor; optional ownerUserId must identify an ACTIVE user and does not grant any permission.
  GET catalog requires process.catalog.read/process.start or management/monitor.all. Design/publish/monitor.all see all definitions, with minimal metadata only.
  Catalog/start readers see only ACTIVE definitions pointing at their own PUBLISHED version with engine mapping. Scope is applied before count/pagination.
  GET definition/history/configuration requires process.design or process.publish; owner, start, catalog and monitor rights alone cannot read management metadata.
  History defaults to versionNumber,desc. Catalog sorts key/name/updatedAt asc/desc. Pages start at 0, size 1..100.
  P4.5 POST /{definitionId}/validate checks the supplied unsaved authoring artifact for process.design/process.publish; returns 422 with field/elementId details. XML process ID must match definition key. This sample uses purchase-request. Validation never deploys. Draft editing, publish and lifecycle follow later. Creating a draft never deploys to Flowable.

  P4.6 PUT /{definitionId}/draft requires process.design, versionId, expectedRevision and nested model; safe incomplete drafts may save, while stale revisions and non-DRAFT versions return 409. Change revision in sample after each successful save.
  P4.7 POST /{definitionId}/publish requires process.publish independently of design, an Idempotency-Key UUID, versionId and expectedRevision. Set processOperationKey to a new UUID for a new operation and processRevision to the saved revision. Retry the exact same operation with the same key; a changed version/revision returns IDEMPOTENCY_KEY_REUSED. Full validation of the persisted artifact precedes Flowable deployment. Published artifacts contain authoring bpmnXml, exact deploymentXml, SHA-256 artifactChecksum and engine mapping. Publication, active pointer, receipt and audit commit or roll back together. At least one user task bound to a common ACTIVE/PUBLISHED form version is required. The minimal start/end Save sample is intentionally incomplete for publication.
  P4.8 GET /management is restricted to design/publish, searches literal names/keys with q (max 200), filters definitions having a versionStatus DRAFT/PUBLISHED/RETIRED, then counts/paginates. GET /startable requires process.start or process.catalog.read independently of management, returns only minimal ACTIVE/current PUBLISHED options and version IDs; no owner/XML/engine/config metadata.
  P4.8 POST clone/duplicate require design; retire/activate require publish. All accept source versionId/expectedRevision and a new UUID processOperationKey, reused only for an exact retry. Lifecycle receipts bind actor/key to all payload fields and operation. Clone allocates the next business version with independent DRAFT content and no engine mapping; duplicate creates a new definition/key with copied safe authoring XML/DI/metadata. Duplicate optionally accepts description/ownerUserId, validated like creation. Activate selects a PUBLISHED version for new records. Retire marks PUBLISHED as RETIRED, clearing its active pointer when selected; it never suspends/deletes existing instances/deployments/history or automatically selects another version. Retired versions cannot be reactivated; clone and publish a new version instead. Receipt and audit share the mutation transaction. Management tabs count definitions having matching versions, not version rows. Read current revision before every new operation.
  P5.1 Start Event metadata supports description/fieldAccess and a common formVersionId binding, using the same BPM extension and revision/round-trip rules. Configure requester permissions explicitly, separate from approvers; all fields default HIDDEN. Full validation checks field references/common published form. New publication requires this submission policy to have an EDITABLE field before any deployment, then marks record_start_ready. /startable and activate exclude historical unconfigured versions; management still reads/clones them, and no artifact is rewritten in place. Published XML/config/bindings/checksum/mapping/ready flag are also protected against accidental JPA updates.
