$kind: http-request
order: 8000
method: POST
url: '{{baseUrl}}/api/v1/process-definitions/{{processDefinitionId}}/publish'
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: '{{processOperationKey}}'
body:
  type: json
  content: |-
    {
      "versionId": "{{processVersionId}}",
      "expectedRevision": {{processRevision}}
    }
