$kind: collection
name: Records
description: |-
  P5.1 requester-owned drafts. New/create require BOTH record.create and process.start and the explicitly selected current PUBLISHED version with a configured Start Event form/EDITABLE field policy. No engine instance is created for a draft. Configure the Start Event via the designer, save and publish before using these requests. Catalog /startable now excludes versions without this submission configuration; legacy unconfigured published versions remain available to management and can be cloned/configured.
  Requester, businessKey, status and form/process pinning are server-controlled. Body never supplies actor/engine/final state. Initial SAVE_DRAFT may omit required values; patch only changes EDITABLE fields. Form views remove HIDDEN schema/data/UI fields; owner write rights and read scope are checked server-side, not inferred from UI.
  GET mine requires record.read.own, always filters the authenticated requester before count/page, supports literal q and status, sorts title/businessKey/createdAt/updatedAt asc/desc. GET by ID requires read.own + ownership or read.all; participant access is introduced with runtime participation. A read-all actor cannot edit somebody else's draft.
  PUT draft requires record.update.draft, ownership, DRAFT state and expectedRevision. DELETE draft similarly requires record.delete.draft and current revision. Conflicts return 409; foreign ownership returns 403. Read/save/delete continue using the pinned schema after process retirement; new/create then reject VERSION_NOT_STARTABLE. Save/read do not silently rebind to the latest version.
  These mutations and audit are atomic. P5.1 creation has no idempotency receipt; saving an existing draft is protected by revision. Submit idempotency follows P5.2. Non-empty attachment references are rejected until the controlled upload/link service is wired; a UUID supplied by a caller is not an uploaded file.
  P5.2 POST /{id}/submit requires record.create + process.start + requester ownership, current DRAFT/revision and still-current startable pinned version. Send expectedRevision/title/patch and a UUID recordOperationKey. SUBMIT validates all editable required fields, current active requester department and allowed patch; actor/department/instance IDs are never client inputs. Starts the exact frozen engineDefinitionId, stores department snapshot and one immutable engine mapping. Submit/audit/receipt/engine commit or roll back together. Retry the same key/body returns the existing record result even if the version later retires; changed payload with the same actor/key returns IDEMPOTENCY_KEY_REUSED. A different key cannot submit the same record twice. Keep recordRevision unchanged for an exact Submit retry; this request intentionally does not update it after response. Save and read the latest revision before a new operation. The empty patch sample submits already-saved complete data; fill required requester fields first. Retired drafts remain readable/saveable but SUBMIT is unavailable. Synchronous completion is reported as COMPLETED, otherwise IN_PROGRESS; task assignment/inbox/complete follow P5.3+. Engine variables use trusted JSON strings, with exact money/decimal values and no arbitrary Java object serialization.
