$kind: collection
name: Tasks
description: |-
  P5.5 POST /tasks/{taskId}/complete accepts expectedRevision, an action offered by current task detail, a field patch and optional reason (required for REJECT/REQUEST_CHANGES, max 4000). Requires task.complete and the actual assignee; candidates must claim first. Actor/assignee/final state/variables are server-owned. Set recordRevision from current task detail and a UUID taskOperationKey before first attempt. Reuse exact taskId/body/key on lost response; this request intentionally never updates revision after response. A typed payload fingerprint detects reuse with different task/action/revision/reason/patch, including across records for the same actor. Empty reason and omitted/null reason are distinct fingerprints. Receipt survives task completion and returns the original transition result; it is not a fresh current-record query. New operation needs fresh revision and key.
  Complete validates frozen step action and field policy against pinned schema, updates scalar JSON variables, action log, engine, record outcome/revision, receipt and audit in one transaction. Any failure rolls everything back, including a newly created next task. Result IN_PROGRESS means only that step finished; COMPLETED/REJECTED requires the actual engine instance to end. Runtime does not require its version to remain startable. Assigned task detail now returns editable fields/actions; unclaimed candidates get read-only fields and no complete actions. Nonempty unlinked attachment references remain rejected pending controlled file service. Reject/correction loop integration follows P5.6.
  P5.4 GET /tasks?box=ASSIGNED|CANDIDATE&q=&page=0&size=10 and GET /tasks/{taskId} require task.complete and actual assignment/current candidacy; CANDIDATE also requires task.claim. Counts/pages are computed after scope and literal search filtering, never expose orphan technical engine tasks. POST /tasks/{taskId}/claim has no body or client assignee/groups; it requires both permissions and current active directory membership, excludes requester and checks app-owned group links. Concurrent claim has one winner; a different winner yields TASK_CONFLICT. Retrying as the same current assignee returns current detail without another audit. Claim/audit share a transaction and roll back together. Candidates only receive a read-only filtered step form, not hidden fields. P5.4 task forms remain read-only until complete is wired in P5.5; receipt or form actions are not claim inputs. Set taskId from your scoped inbox before detail/claim.
  Runtime assignment uses frozen process configuration and the requester department captured at submission. People/active status/permissions are resolved from the server directory when each task is created. SPECIFIC_USER and REQUESTER_MANAGER create direct assignments; DEPARTMENT and ROLE create app-owned candidate groups restricted to that department (and role). Claim must recheck current server membership and permissions; a candidate group is never company-wide. Self-approval is excluded. A trusted RESUBMIT-only correction step is assigned to the authenticated requester as a separate internal correction policy.
  Unresolvable assignment leaves the engine task waiting with no assignee or candidates and records a SYSTEM audit/exception in the same transaction. It never auto-completes. GET assignment-exceptions requires task.reassign and returns OPEN support metadata only, newest first. It does not grant form access or approval authority. UI supports paging, refresh, empty and error states. Reassignment with reason is implemented in the later support milestone P7.3; editing directory membership does not silently move an existing assigned task.
