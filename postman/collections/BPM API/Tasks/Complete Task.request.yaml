$kind: http-request
order: 6000
method: POST
url: '{{baseUrl}}/api/v1/tasks/{{taskId}}/complete'
headers:
  - key: Idempotency-Key
    value: '{{taskOperationKey}}'
body:
  type: json
  content: |-
    {
      "expectedRevision": {{recordRevision}},
      "action": "APPROVE",
      "patch": { "values": {}, "removeFields": [] },
      "reason": null
    }
