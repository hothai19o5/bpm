$kind: http-request
order: 4000
method: GET
url: '{{baseUrl}}/api/v1/tasks/{{taskId}}'
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        pm.collectionVariables.set('recordRevision', String(pm.response.json().data.recordRevision));
      }
    language: text/javascript
