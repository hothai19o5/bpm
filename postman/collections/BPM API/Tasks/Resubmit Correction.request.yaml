$kind: http-request
order: 8000
method: POST
url: '{{baseUrl}}/api/v1/tasks/{{taskId}}/complete'
headers:
  - key: Idempotency-Key
    value: '{{taskOperationKey}}'
body:
  type: json
  content: |-
    {
      "expectedRevision": {{recordRevision}},
      "action": "RESUBMIT",
      "patch": { "values": { "amount": "50000001" }, "removeFields": [] },
      "reason": null
    }
