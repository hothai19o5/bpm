spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bpm}
    username: ${DB_USERNAME:bpm}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update

# Dev only: let Flowable create/update its own tables without migrations.
flowable:
  database-schema-update: "true"
