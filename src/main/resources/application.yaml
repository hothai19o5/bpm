spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  autoconfigure:
    # P2.1 will supply the account provider; do not generate a demo user/password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: bpm
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: business
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # Flowable uses the first search-path schema; Hibernate qualifies its tables as business.*.
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bpm}?currentSchema=flowable,business,public
    username: ${DB_USERNAME:bpm}
    password: ${DB_PASSWORD:root}
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-exception: false
      include-stacktrace: never

server:
  shutdown: graceful

bpm:
  storage:
    enabled: ${BPM_STORAGE_ENABLED:false}
    endpoint: ${BPM_STORAGE_ENDPOINT:}
    bucket: ${BPM_STORAGE_BUCKET:bpm-files}
    region: ${BPM_STORAGE_REGION:us-east-1}
    access-key: ${BPM_STORAGE_ACCESS_KEY:}
    secret-key: ${BPM_STORAGE_SECRET_KEY:}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:}
      issuer: ${JWT_ISSUER:https://bpm.local}
      audience: ${JWT_AUDIENCE:bpm-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    authentication:
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

flowable:
  # Keep database-schema unset: Flowable would call Connection#setSchema("flowable")
  # and collapse the shared transaction connection's multi-schema search path.
  database-schema-update: "false"
  # Publish/deploy is explicit through the adapter; do not deploy classpath BPMN at startup.
  check-process-definitions: false
  history-level: audit
