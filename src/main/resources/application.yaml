spring:
  autoconfigure:
    # P2.1 will supply the account provider; do not generate a demo user/password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: bpm
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bpm}
    username: ${DB_USERNAME:bpm}
    password: ${DB_PASSWORD:root}
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-exception: false
      include-stacktrace: never

server:
  shutdown: graceful

bpm:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:}
      issuer: ${JWT_ISSUER:https://bpm.local}
      audience: ${JWT_AUDIENCE:bpm-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

flowable:
  database-schema-update: "false"
  # Publish/deploy is explicit through the adapter; do not deploy classpath BPMN at startup.
  check-process-definitions: false
  history-level: audit
