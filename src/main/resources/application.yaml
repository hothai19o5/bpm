spring:
  application:
    name: bpm
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bpm}
    username: ${DB_USERNAME:bpm}
    password: ${DB_PASSWORD:root}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

flowable:
  database-schema-update: "false"
